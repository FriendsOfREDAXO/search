name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  composer:
    name: Abhaengigkeiten auf der kleinsten unterstuetzten PHP-Version
    # Das Lockfile zog sich eine Abhaengigkeit heran, die PHP 8.3 verlangte, waehrend
    # package.yml 8.1 verspricht. Aufgefallen ist das erst, als die Veroeffentlichung
    # auf redaxo.org daran scheiterte -- die Syntaxpruefung sieht so etwas nicht.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-progress --no-interaction
