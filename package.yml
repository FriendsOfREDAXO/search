package: search
version: '0.1.0'
author: Friends Of REDAXO
supportpage: https://github.com/FriendsOfRedaxo/search/issues

page:
    title: 'translate:search_title'
    perm: admin[]
    pjax: false
    icon: rex-icon fa-search
    subpages:
        sources: { title: 'translate:search_sources' }
        search: { title: 'translate:search_search' }
        settings:
            title: 'translate:search_settings'
            icon: 'rex-icon fa-cogs'
            itemAttr:
                class: pull-right
        docs:
            title: 'translate:search_docs'
            icon: 'rex-icon fa-book'
            itemAttr:
                class: pull-right

requires:
    php: '>=8.1'
    redaxo: ^5.17.0

console_commands:
    search:index: rex_search_command_index
    search:words: rex_search_command_words
    search:chunks: rex_search_command_chunks
    search:embed: rex_search_command_embed
    search:ask: rex_search_command_ask
